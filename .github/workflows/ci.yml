name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (mock mode)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            src/app/server/requirements.txt
            src/app/server/tests/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r src/app/server/requirements.txt \
                      -r src/app/server/tests/requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ src/app/server/tests -q
