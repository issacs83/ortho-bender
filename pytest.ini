[pytest]
# One config for the whole repo, so every way of invoking pytest runs the
# same tests. Before this there was no root config at all and three
# invocations disagreed:
#
#   pytest                        aborted -- it collects
#                                 src/dev/motor_sdoff_test.py, which imports
#                                 spidev and only resolves on the board, and
#                                 one collection error stops the whole run
#   cd src/app/server && pytest   178 passed, silently skipping the
#                                 top-level tests/ directory entirely
#   pytest tests/ src/app/...     the full set, hardcoded in ci.yml and
#                                 again in .vscode/settings.json
#
# Two safety-test failures lived in that gap for a day: green from inside
# src/app/server, red from the root, and nobody ran both.
#
# CAREFUL WITH THIS FILE. Adding it moves pytest's rootdir to the repo root,
# which stops src/app/server/pytest.ini from being the configfile -- so
# everything that one provided has to be here or it is silently lost. The
# first draft of this file omitted asyncio_mode and turned 114 async tests
# into skips while still printing "passed". Check the summary line for a
# skip count after touching anything below.
#
# One trap this does NOT close: testpaths applies only when pytest is run
# FROM the rootdir. `cd src/app/server && pytest` still collects just that
# directory (178), because pytest falls back to cwd. It no longer loses the
# asyncio config doing so, but it is still the partial run -- use the repo
# root, or `tools/dev.sh test`, for the number that matches CI.
testpaths =
    tests
    src/app/server/tests

# tests/ imports `from src.app.server...` (needs the repo root); the tests
# under src/app/server import `from server...` (needs src/app, which is what
# the old nested ini's `pythonpath = ..` supplied).
pythonpath =
    .
    src/app

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
